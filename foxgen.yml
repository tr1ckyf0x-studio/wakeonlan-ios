executables:
  genesis: "mint run genesis"
  # Required by the FoxGen 1.0.0 config schema; never invoked by module scaffolding.
  swiftgen: "mint run swiftgen"
  sourcery: "mint run sourcery"

viper:
  modulesPath: "Modules"
  templatePath: "swift-templates/Genesis/VIPER/template.yml"

bundle:
  modulesPath: "Modules"
  templatePath: "swift-templates/Genesis/Bundle/template.yml"
