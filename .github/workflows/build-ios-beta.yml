name: Build iOS Beta
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: build-upload-wake-on-lan
  cancel-in-progress: false

jobs:
  Build:
    # The Xcode label makes a rebuilt runner image queue the job with a clear reason instead of building
    # with a different Xcode unnoticed.
    runs-on: [macos-vm, xcode-27.2]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Bootstrap
        run: |
          # The shims are baked into the image. rbenv 1.3.2's own rehash fails when another one holds
          # its lock, and under `bash -e` that ends the step with exit 1 and no output.
          eval "$(rbenv init - --no-rehash bash)"
          make bootstrap

      - name: Import GPG key and reveal secrets
        run: |
          # Import into a throwaway keyring rather than the default one. The virtual machine is
          # destroyed after the job, so nothing would outlive it either way — this is kept because
          # it costs nothing and keeps the workflow correct on any runner it is ever pointed at.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          rm -rf "$GNUPGHOME"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_FPR=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          echo "${KEY_FPR}:6:" | gpg --import-ownertrust
          git secret reveal
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Provide the SSH key for the certificates repository
        env:
          CI_SSH_PRIVATE_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
        run: |
          # `match` clones match-certificates over SSH, and the runner is an ephemeral virtual
          # machine with an empty home directory. Everything goes into RUNNER_TEMP rather than
          # ~/.ssh, the same way the GPG keyring above does: a key written to ~/.ssh would be
          # deleted again by the cleanup step, which on any persistent runner destroys its own key.
          printf '%s\n' "$CI_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ci_ssh_key"
          chmod 600 "$RUNNER_TEMP/ci_ssh_key"
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $RUNNER_TEMP/ci_ssh_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" >> "$GITHUB_ENV"

      - name: Create temporary keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Build release
        env:
          LANG: en_US.UTF-8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYCHAIN_NAME: build.keychain
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          eval "$(rbenv init - --no-rehash bash)"
          bundle exec fastlane ios sync_release_certificates
          bundle exec fastlane ios beta

      # `|| true` because this runs on failure too, and a job that failed before the keychain was
      # created would otherwise report a second, misleading failure on top of the real one.
      - name: Delete temporary keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Remove the revealed secrets and the temporary keyring
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/gnupg" --kill all || true
          rm -rf "$RUNNER_TEMP/gnupg"
          rm -f "$RUNNER_TEMP/ci_ssh_key" "$RUNNER_TEMP/known_hosts"
          # `git secret reveal` decrypts the App Store Connect key into the workspace.
          rm -f fastlane/api_key.json
