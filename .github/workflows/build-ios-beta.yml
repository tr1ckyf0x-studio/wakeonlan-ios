name: Build iOS Beta
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: build-upload-wake-on-lan
  cancel-in-progress: false

jobs:
  Build:
    runs-on: self-hosted-mac
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Bootstrap
        run: |
          eval "$(rbenv init -)"
          make bootstrap

      - name: Import GPG key and reveal secrets
        run: |
          # Import into a throwaway keyring rather than the runner's own. This runner is self-hosted
          # and also serves the Checks workflow on pull_request, so a signing key left in the default
          # keyring outlives the job on a machine that runs other people's code.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          rm -rf "$GNUPGHOME"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_FPR=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          echo "${KEY_FPR}:6:" | gpg --import-ownertrust
          git secret reveal
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Create temporary keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Build release
        env:
          LANG: en_US.UTF-8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYCHAIN_NAME: build.keychain
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          eval "$(rbenv init -)"
          bundle exec fastlane ios sync_release_certificates
          bundle exec fastlane ios beta skip_waiting_for_build_processing:true

      - name: Delete temporary keychain
        if: always()
        run: security delete-keychain build.keychain

      - name: Remove the revealed secrets and the temporary keyring
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/gnupg" --kill all || true
          rm -rf "$RUNNER_TEMP/gnupg"
          # `git secret reveal` decrypts the App Store Connect key into the workspace, which persists
          # between jobs on a self-hosted runner.
          rm -f fastlane/api_key.json
