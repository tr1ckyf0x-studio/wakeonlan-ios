# SwiftLint configuration — Wake on LAN (Awake)
# Tuned for SwiftLint 0.65.0 (pinned in Mintfile).
# Rule directory: https://realm.github.io/SwiftLint/rule-directory.html
#
# Policy:
#   * Default (on-by-default) rules stay ENABLED and are NOT listed — only exceptions go to disabled_rules.
#   * opt_in_rules   — extra rules we deliberately turn on.
#   * analyzer_rules — run only via `swiftlint analyze` (needs a compiler log).
# Regenerate the full rule inventory with: `mint run swiftlint rules`.

# --- Paths -------------------------------------------------------------------
included:
  - "Wake On Lan"
  - "SharedCode"
  - "Intent"

excluded:
  - "**/*.generated.swift"
  - "swift-templates"                        # Genesis code-gen templates (not compilable Swift)
  - ".build"
  - ".bin"
  - "vendor"

reporter: "xcode"

# --- Disabled default rules --------------------------------------------------
disabled_rules:
  # Size and complexity metrics — managed by hand, without linter thresholds.
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - type_body_length
  - line_length
  - trailing_comma
  - inclusive_language
  # Protocol method parameters are part of a contract, not dead code: UIKit dictates the
  # UIApplicationDelegate signatures, and `viewDidLoad(_ view:)` is the module's VIPER contract.
  # 111 violations, all false.
  - unused_parameter
  # Layout is programmatic; insets and sizes are written as numbers inside the SnapKit blocks.
  - no_magic_numbers
  # `tv` and `pc` are the correct device names, and `at:` is an idiomatic argument label.
  - identifier_name
  # The TODOs in the code are deliberate and tracked separately, in BACKLOG.md.
  - todo
  # @objc protocol requirements (WOLIntentHandling) are declared async whether or not the
  # implementation awaits anything. The autofix stripped `async` and broke the conformance.
  - async_without_await
  # UIKit dictates the signatures: `[UIApplication.LaunchOptionsKey: Any]?` cannot be rewritten.
  - discouraged_optional_collection
  # Intents requires `INObjectCollection<NSString>`, and UIKit requires `NSMutableAttributedString`.
  - legacy_objc_type
  # An empty `public init() { }` is part of a service's public API, not a block left unfinished.
  - no_empty_block
  # A one-line switch mapping (`case .tv: .tv`) reads better than the expanded form.
  - switch_case_on_newline
  # The `private let appearance = Appearance(); struct Appearance { … }` idiom is used across
  # 12 view files as the single way to keep layout constants next to what they describe.
  - let_var_whitespace
  # The rule wants helper types at the TOP of the file, ahead of the main one. This codebase
  # follows the opposite order: the main type first, private helpers at the bottom.
  - file_types_order
  # `@available` and `@objc` are written on their own line in this project.
  - attributes
  # The codebase consistently uses `public extension Foo { func bar() }`. Rewriting it as
  # `extension Foo { public func bar() }` means adding `public` to every member by hand —
  # otherwise the API turns internal and neighbouring targets stop building. 33 such places,
  # no benefit; the rule is off on purpose.
  - no_extension_access_modifier

# --- Opt-in rules ------------------------------------------------------------
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - fatal_error_message
  - file_name_no_space
  - final_test_case
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - function_default_parameter_at_end
  - ibinspectable_in_extension
  - identical_operands
  - implicitly_unwrapped_optional
  - indentation_width
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_uigraphics_function
  - literal_expression_end_indentation
  - local_doc_comment
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_asset_symbols
  - prefer_condition_list
  - prefer_key_path
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - private_swiftui_state
  - prohibited_interface_builder
  - prohibited_super_call
  - reduce_into
  - redundant_final
  - redundant_nil_coalescing
  - redundant_self
  - redundant_type_annotation
  - return_value_from_void_function
  - shorthand_argument
  - sorted_first_last
  - sorted_imports
  - static_operator
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_escaping
  - unneeded_parentheses_in_closure_argument
  - unneeded_throws_rethrows
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - yoda_condition

# --- Analyzer rules (swiftlint analyze) --------------------------------------
analyzer_rules:
  - unused_import

# --- Rule configuration ------------------------------------------------------
# Multiline call arguments: the first argument goes on its own line rather than against the "(".
# Single-line calls stay on one line; together with multiline_arguments_brackets this produces
# the form foo(\n  a: 1,\n  b: 2\n).
multiline_arguments:
  first_argument_location: next_line

# /** ... */ blocks are documentation rather than code, so the rule should not measure them.
indentation_width:
  include_comments: false

# type_name and generic_type_name stay enabled (default); only the length threshold is raised.
type_name:
  max_length:
    warning: 100

generic_type_name:
  max_length:
    warning: 100

# --- custom_rules ------------------------------------------------------------
custom_rules:
  # Bans raw SF Symbol string literals: SFSafeSymbols only.
  # match_kinds restricts matching to code (identifier/typeidentifier) so the rule does not
  # fire inside string literals or comments.
  uiimage_system_name_string:
    name: "SF Symbol string literal"
    regex: '\bUIImage\s*\(\s*systemName\s*:'
    match_kinds:
      - identifier
      - typeidentifier
    message: "Use SFSafeSymbols: UIImage(systemSymbol:) instead of UIImage(systemName:)."
    severity: error
