# SwiftLint configuration — Wake on LAN (Awake)
# Tuned for SwiftLint 0.65.0 (pinned in Mintfile).
# Rule directory: https://realm.github.io/SwiftLint/rule-directory.html
#
# Policy:
#   * Default (on-by-default) rules stay ENABLED and are NOT listed — only exceptions go to disabled_rules.
#   * opt_in_rules   — extra rules we deliberately turn on.
#   * analyzer_rules — run only via `swiftlint analyze` (needs a compiler log).
# Regenerate the full rule inventory with: `mint run swiftlint rules`.

# --- Paths -------------------------------------------------------------------
included:
  - "Wake On Lan"
  - "SharedCode"
  - "Intent"

excluded:
  - "Wake On Lan/Localization/Localization.swift" # SwiftGen output (strings)
  - "**/*.generated.swift"
  - "swift-templates"                        # Genesis code-gen templates (not compilable Swift)
  - ".build"
  - ".bin"
  - "vendor"

reporter: "xcode"

# --- Disabled default rules --------------------------------------------------
disabled_rules:
  # Метрики размера/сложности — управляем вручную, без порогов линтера.
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - type_body_length
  - line_length
  - trailing_comma
  - inclusive_language
  # Параметры протокольных методов — часть контракта, а не мёртвый код: сигнатуры
  # UIApplicationDelegate диктует UIKit, а `viewDidLoad(_ view:)` — VIPER-контракт модуля.
  # 111 срабатываний, все ложные.
  - unused_parameter
  # Вёрстка программная, отступы и размеры задаются числами прямо в SnapKit-блоках.
  - no_magic_numbers
  # `tv`, `pc` — правильные имена устройств, `at:` — идиоматичная метка аргумента.
  - identifier_name
  # TODO в коде расставлены осознанно и отслеживаются отдельно.
  - todo
  # Требования @objc-протоколов (WOLIntentHandling) объявлены async независимо от того,
  # использует ли реализация await. Автофикс снимал `async` и ломал конформанс.
  - async_without_await
  # Сигнатуры диктует UIKit: `[UIApplication.LaunchOptionsKey: Any]?` не переписать.
  - discouraged_optional_collection
  # `INObjectCollection<NSString>` требует Intents, `NSMutableAttributedString` — UIKit.
  - legacy_objc_type
  # Пустые `public init() { }` — часть публичного API сервисов, а не забытый блок.
  - no_empty_block
  # Однострочный switch-маппинг (`case .tv: .tv`) читается лучше развёрнутого.
  - switch_case_on_newline
  # Идиома `private let appearance = Appearance(); struct Appearance { … }` используется
  # в 12 вью-файлах как единый способ держать константы вёрстки рядом с их описанием.
  - let_var_whitespace
  # Правило требует держать вспомогательные типы В НАЧАЛЕ файла, перед основным.
  # Кодовая база следует обратному порядку: основной тип первым, приватные помощники — внизу.
  - file_types_order
  # `@available` и `@objc` в этом проекте пишутся на отдельной строке.
  - attributes
  # Кодовая база последовательно использует `public extension Foo { func bar() }`.
  # Переписывание на `extension Foo { public func bar() }` требует расстановки `public`
  # у каждого члена вручную: иначе API становится internal и падает сборка соседних таргетов.
  # 33 таких места, выгоды нет — правило выключено осознанно.
  - no_extension_access_modifier

