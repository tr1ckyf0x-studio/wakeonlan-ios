  - prohibited_interface_builder
  - prohibited_super_call
  - reduce_into
  - redundant_final
  - redundant_nil_coalescing
  - redundant_self
  - redundant_type_annotation
  - return_value_from_void_function
  - shorthand_argument
  - sorted_first_last
  - sorted_imports
  - static_operator
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_escaping
  - unneeded_parentheses_in_closure_argument
  - unneeded_throws_rethrows
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - yoda_condition

# --- Analyzer rules (swiftlint analyze) --------------------------------------
analyzer_rules:
  - unused_import

# --- Rule configuration ------------------------------------------------------
# Многострочные аргументы вызова: первый аргумент — на новой строке (не прижат к "(").
# Однострочные вызовы остаются на одной строке; вместе с multiline_arguments_brackets
# даёт форму foo(\n  a: 1,\n  b: 2\n).
multiline_arguments:
  first_argument_location: next_line

# Блоки /** ... */ — документация, а не код: их отступы правилу считать не нужно.
indentation_width:
  include_comments: false

# type_name / generic_type_name остаются включёнными (default), поднимаем порог длины имени.
type_name:
  max_length:
    warning: 100

generic_type_name:
  max_length:
    warning: 100

# --- custom_rules ------------------------------------------------------------
custom_rules:
  # Запрет строковых литералов SF Symbols: только SFSafeSymbols.
  # match_kinds ограничивает совпадение кодом (identifier/typeidentifier),
  # чтобы не срабатывать внутри строковых литералов и комментариев.
  uiimage_system_name_string:
    name: "SF Symbol string literal"
    regex: '\bUIImage\s*\(\s*systemName\s*:'
    match_kinds:
      - identifier
      - typeidentifier
    message: "Use SFSafeSymbols: UIImage(systemSymbol:) instead of UIImage(systemName:)."
    severity: error
