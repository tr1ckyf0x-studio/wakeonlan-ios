name: "Wake On LAN"

configs:
  Debug: debug
  Release: release

options:
  deploymentTarget:
    iOS: 17.0

attributes:
  ORGANIZATIONNAME: "Vladislav Lisianskii"

packages:
  CocoaLumberjack:
    url: https://github.com/CocoaLumberjack/CocoaLumberjack.git
    exactVersion: 3.9.1
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.18.0
  RouteComposer:
    url: https://github.com/ekazaev/route-composer.git
    exactVersion: 2.22.2
  SFSafeSymbols:
    url: https://github.com/SFSafeSymbols/SFSafeSymbols.git
    exactVersion: 7.0.0
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    exactVersion: 6.0.0
  shared-frameworks:
    url: https://github.com/tr1ckyf0x-studio/shared-frameworks.git
    exactVersion: 1.0.0

# Base.xcconfig is attached here rather than #include'd by every target xcconfig. XcodeGen omits any
# preset the attached file declares, and does so for a project-level file too, so one attachment
# covers every target -- measured, not assumed: with this in place the generated pbxproj carries no
# TARGETED_DEVICE_FAMILY and no SWIFT_VERSION at all.
configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig

targets:
  Wake On LAN:
    platform: iOS
    type: application
    sources:
      - path: "Wake On Lan"
        excludes:
          - "**/*.secret"
          - "**/CLAUDE.md"
        optional: true
      - IntentSharedSources
    dependencies:
      - target: WOLSharedProtocolsAndModels
      - target: CoreDataService
      - target: WakeOnLanService
      - target: Intent
      - package: CocoaLumberjack
        products:
          - CocoaLumberjack
          - CocoaLumberjackSwift
      - package: firebase-ios-sdk
        products:
          - FirebaseCore
          - FirebaseCrashlytics
      - package: RouteComposer
        product: RouteComposer
      - package: SFSafeSymbols
        product: SFSafeSymbols
      - package: SnapKit
        product: SnapKit
      - package: shared-frameworks
        product: PersistenceCore

    scheme: {}

    configFiles:
      Debug: Configs/AppDebug.xcconfig
      Release: Configs/AppRelease.xcconfig

    preBuildScripts:
    - name: "Swiftlint"
      basedOnDependencyAnalysis: false
      # --strict promotes warnings to errors, matching SWIFT_TREAT_WARNINGS_AS_ERRORS for Swift
      # itself. Switched on here rather than with the configuration itself: the rules surfaced 166
      # violations, and turning them into errors before fixing them would have broken the build.
      script: |
              .bin/swiftlint --strict
    postBuildScripts:
      - name: "Crashlytics"
        basedOnDependencyAnalysis: false
        # Uploads every dSYM the build produced, not only the app's. The Siri extension and the three
        # SharedCode frameworks each get their own, and without them a crash inside one of them --
        # `fatalError("Persistent container URL is unavailable")` in `CoreDataService.init()`, say --
        # arrives with nothing but hex addresses. `upload-symbols` accepts a directory and walks it,
        # so one invocation covers the lot; Firebase's own `run` wrapper does not, because
        # `--build-phase` makes it look at `$DWARF_DSYM_FILE_NAME` alone.
        #
        # It also runs in the foreground. `run` backgrounds the upload and sends its output to
        # /dev/null, so a failed upload is indistinguishable from a successful one until a crash
        # comes back unreadable weeks later. Better to fail the build and retry.
        #
        # The skip is deliberately fail-safe: an unset variable uploads. Inverting it would let a typo
        # silently stop shipping dSYMs, with nothing downstream to notice.
        script: |
                if [ "$SKIP_CRASHLYTICS_UPLOAD" = "1" ]; then
                  echo "SKIP_CRASHLYTICS_UPLOAD=1, not uploading dSYMs"
                  exit 0
                fi

                case "$DEBUG_INFORMATION_FORMAT" in
                  *dwarf-with-dsym*) ;;
                  *)
                    echo "DEBUG_INFORMATION_FORMAT=$DEBUG_INFORMATION_FORMAT produces no dSYM, nothing to upload"
                    exit 0
                    ;;
                esac

                UPLOAD_SYMBOLS="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"
                SERVICE_PLIST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"

                # Validate first, exactly as Firebase's wrapper does: it catches a misconfigured phase
                # without paying for the upload.
                "$UPLOAD_SYMBOLS" -gsp "$SERVICE_PLIST" -p ios --validate -- "$DWARF_DSYM_FOLDER_PATH" || exit 1
                "$UPLOAD_SYMBOLS" -gsp "$SERVICE_PLIST" -p ios -- "$DWARF_DSYM_FOLDER_PATH"
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}.debug.dylib
  Intent:
    platform: iOS
    type: app-extension
    sources:
      - Intent
      - IntentSharedSources
    scheme: {}
    configFiles:
      Debug: Configs/IntentDebug.xcconfig
      Release: Configs/IntentRelease.xcconfig
    dependencies:
      - target: WOLSharedProtocolsAndModels
      - target: CoreDataService
      - target: WakeOnLanService
      - sdk: Intents.framework
      - package: shared-frameworks
        product: PersistenceCore

  WakeOnLanService:
    platform: iOS
    type: framework
    sources:
      - path: "SharedCode/WakeOnLanService"
    dependencies:
      - target: WOLSharedProtocolsAndModels
    configFiles:
      Debug: Configs/WakeOnLanService.xcconfig
      Release: Configs/WakeOnLanService.xcconfig

  WOLSharedProtocolsAndModels:
    platform: iOS
    type: framework
    sources:
      - path: "SharedCode/WOLSharedProtocolsAndModels"
    dependencies:
      - package: shared-frameworks
        product: SharedProtocolsAndModels
      - package: SFSafeSymbols
        product: SFSafeSymbols
    configFiles:
      Debug: Configs/WOLSharedProtocolsAndModels.xcconfig
      Release: Configs/WOLSharedProtocolsAndModels.xcconfig

  SharedCodeTests:
    platform: iOS
    type: bundle.unit-test
    sources:
      - path: SharedCodeTests
    dependencies:
      - target: CoreDataService
    configFiles:
      Debug: Configs/SharedCodeTests.xcconfig
      Release: Configs/SharedCodeTests.xcconfig
    scheme:
      testTargets:
        - SharedCodeTests
      # Traps on the first Core Data concurrency violation instead of letting it corrupt state and
      # crash somewhere unrelated later. A stage reading rows through the wrong queue cost a day of
      # chasing a 1-in-3 crash that landed in a different test every time; this turns that class of
      # bug into a deterministic stop at the offending call. It found two violations in the fixture
      # the first time it was switched on.
      commandLineArguments:
        "-com.apple.CoreData.ConcurrencyDebug 1": true

  CoreDataService:
    platform: iOS
    type: framework
    sources:
      - path: "SharedCode/CoreDataService"
    resources:
      - path: "SharedCode/CoreDataService/Resources"
    dependencies:
      - target: WOLSharedProtocolsAndModels
      - package: shared-frameworks
        product: PersistenceCore
      - package: SFSafeSymbols
        product: SFSafeSymbols
      - package: CocoaLumberjack
        products:
          - CocoaLumberjack
          - CocoaLumberjackSwift
    configFiles:
      Debug: Configs/CoreDataService.xcconfig
      Release: Configs/CoreDataService.xcconfig
