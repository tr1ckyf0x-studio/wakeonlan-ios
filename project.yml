name: "Wake on LAN"

configs:
  AppStore Debug: debug
  AppStore Release: release
  AdHoc Debug: debug
  AdHoc Release: release

settings:
  base:
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ENABLE_BITCODE: NO
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_LOCALIZABILITY_EMPTY_CONTEXT: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    SWIFT_UPCOMING_FEATURE_ISOLATED_DEFAULT_VALUES: YES
    DEVELOPMENT_TEAM: SGM5527A99
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: 1.6.1
    CURRENT_PROJECT_VERSION: 1

options:
  deploymentTarget:
    iOS: 16.0

attributes:
  ORGANIZATIONNAME: "Vladislav Lisianskii"

packages:
  CocoaLumberjack:
    url: https://github.com/CocoaLumberjack/CocoaLumberjack.git
    exactVersion: 3.9.0
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.3.0
  ReachabilitySwift:
    url: https://github.com/ashleymills/Reachability.swift.git
    exactVersion: 5.2.4
  RouteComposer:
    url: https://github.com/ekazaev/route-composer.git
    exactVersion: 2.21.0
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    exactVersion: 5.7.1
  shared-frameworks:
    url: https://github.com/tr1ckyf0x-studio/shared-frameworks.git
    exactVersion: 1.0.0

targets:
  Wake on LAN:
    platform: iOS
    type: application
    sources:
      - path: "Wake on LAN"
        excludes:
          - "**/*.secret"
          - "**/swiftgen.yml"
        optional: true
      - IntentSharedSources
    dependencies:
      - target: WOLSharedProtocolsAndModels
      - target: CoreDataService
      - target: WakeOnLanService
      - target: Intent
      - package: CocoaLumberjack
        products:
          - CocoaLumberjack
          - CocoaLumberjackSwift
      - package: firebase-ios-sdk
        products:
          - FirebaseCore
          - FirebaseCrashlytics
      - package: ReachabilitySwift
        product: Reachability
      - package: RouteComposer
        product: RouteComposer
      - package: SnapKit
        product: SnapKit
      - package: shared-frameworks
        product: PersistenceCore

    scheme:
      configVariants:
        - AppStore
        - AdHoc

    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
        DISPLAY_NAME: "Awake"
        INFOPLIST_FILE: "Wake on LAN/Info.plist"
        OTHER_LDFLAGS: $(inherited) -ObjC
        PRODUCT_BUNDLE_IDENTIFIER: com.tr1ckyf0x.wake-on-lan
        CODE_SIGN_ENTITLEMENTS: "Wake on LAN/Wake on LAN.entitlements"
      configs:
        AppStore Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "Wake On Lan Development"
        AppStore Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Wake On Lan AppStore"
          DEAD_CODE_STRIPPING: YES
        AdHoc Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "Wake On Lan Development"
        AdHoc Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Wake On Lan AdHoc"
          DEAD_CODE_STRIPPING: YES
    preBuildScripts:
    - name: "Swiftlint"
      basedOnDependencyAnalysis: false
      script: |
              .bin/swiftlint
    postBuildScripts:
      - name: "Crashlytics"
        basedOnDependencyAnalysis: false
        script: |
                "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}.debug.dylib
  Intent:
    platform: iOS
    type: app-extension
    sources:
      - Intent
      - IntentSharedSources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
        DISPLAY_NAME: "Awake Intent"
        INFOPLIST_FILE: "Intent/Info.plist"
        PRODUCT_BUNDLE_IDENTIFIER: com.tr1ckyf0x.wake-on-lan.intent
        CODE_SIGN_ENTITLEMENTS: "Intent/Intent.entitlements"
      configs:
        AppStore Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "Wake On Lan Siri Intent Development"
        AppStore Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Wake On Lan Siri Intent AppStore"
        AdHoc Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "Wake On Lan Siri Intent Development"
        AdHoc Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Wake On Lan Siri Intent AdHoc"
    dependencies:
      - target: WOLSharedProtocolsAndModels
      - target: CoreDataService
      - target: WakeOnLanService
      - sdk: Intents.framework
      - package: shared-frameworks
        product: PersistenceCore
    scheme:
      configVariants:
        - AppStore
        - AdHoc

  WakeOnLanService:
    platform: iOS
    type: framework
    sources:
      - path: "SharedCode/WakeOnLanService"
    dependencies:
      - target: WOLSharedProtocolsAndModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tr1ckyf0x.wake-on-lan.frameworks.WakeOnLanService
        GENERATE_INFOPLIST_FILE: YES

  WOLSharedProtocolsAndModels:
    platform: iOS
    type: framework
    sources:
      - path: "SharedCode/WOLSharedProtocolsAndModels"
    dependencies:
      - package: shared-frameworks
        product: SharedProtocolsAndModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tr1ckyf0x.wake-on-lan.frameworks.SharedProtocolsAndModels
        GENERATE_INFOPLIST_FILE: YES

  CoreDataService:
    platform: iOS
    type: framework
    sources:
      - path: "SharedCode/CoreDataService"
    resources:
      - path: "SharedCode/CoreDataService/Resources"
    dependencies:
      - target: WOLSharedProtocolsAndModels
      - package: shared-frameworks
        product: PersistenceCore
      - package: CocoaLumberjack
        products:
          - CocoaLumberjack
          - CocoaLumberjackSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tr1ckyf0x.wake-on-lan.frameworks.CoreDataService
        GENERATE_INFOPLIST_FILE: YES
